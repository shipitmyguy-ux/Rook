name: Deploy Rook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          for file in $(find src tests -name '*.js'); do node --check "$file"; done
      - name: Run core regression tests
        run: npm test
      - name: Verify required files
        run: |
          test -f index.html
          test -f src/app.js
          test -f src/styles.css
      - name: Smoke test live Fort Collins listing backend
        run: |
          curl --fail --retry 2 --max-time 30 -sS "https://umvmilulnqnmeqvfoxxc.supabase.co/functions/v1/rook-listings?location=Fort%20Collins%2C%20CO&minBeds=2" -o /tmp/rook-listings.json
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("/tmp/rook-listings.json","utf8"));if(!Array.isArray(p.listings)||!Array.isArray(p.meta?.adapters)||p.listings.length<1||!p.meta.adapters.some(a=>a.ok&&a.count>0))process.exit(1);console.log(JSON.stringify({count:p.listings.length,adapters:p.meta.adapters}))'
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

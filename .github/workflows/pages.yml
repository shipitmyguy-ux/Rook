name: Validate Rook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rook-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          for file in $(find src -name '*.js'); do node --check "$file"; done
      - name: Verify required files
        run: |
          test -f index.html
          test -f src/app.js
          test -f src/styles.css

name: Rook Build Auto Retry

on:
  workflow_run:
    workflows: ["Deploy Rook"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry-transient:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 2 }}
    runs-on: ubuntu-latest
    steps:
      - name: Retry known transient failures once
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              filter: "latest",
              per_page: 100
            });

            const failedJobs = data.jobs.filter(job => job.conclusion === "failure");
            const transientSteps = new Set([
              "Verify live discovery and direct listing validation",
              "Deploy validated update",
              "Deploy visual update"
            ]);

            const onlyTransient = failedJobs.length > 0 && failedJobs.every(job => {
              const failedSteps = (job.steps || []).filter(step => step.conclusion === "failure");
              return failedSteps.length > 0 && failedSteps.every(step => transientSteps.has(step.name));
            });

            if (!onlyTransient) {
              core.notice("Rook failure is not classified as transient; leaving it failed for diagnosis.");
              return;
            }

            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id
            });
            core.notice(`Automatically re-ran transient failed jobs for Rook run ${run.id}.`);

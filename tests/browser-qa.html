<!doctype html>
<meta charset="utf-8">
<title>Rook browser QA</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden}
  iframe{display:block;width:100%;height:100%;border:0}
  #result{position:absolute;left:-9999px;top:-9999px}
</style>
<iframe id="rook" src="../index.html?browser-qa=1"></iframe>
<pre id="result">waiting</pre>
<script>
const frame=document.querySelector("#rook");
const result=document.querySelector("#result");
function finish(){
  try{
    const win=frame.contentWindow, doc=frame.contentDocument;
    const card=doc.querySelector(".property-card.visual-card");
    const media=doc.querySelector(".property-card__media");
    const content=doc.querySelector(".property-card__summary");
    const context=doc.querySelector(".property-card__context");
    const type=doc.querySelector(".property-type-icon");
    const overview=doc.querySelector(".overview-map");
    const map=doc.querySelector("#property-map");
    if(!card||!media||!content||!context||!type||!overview||!map) throw new Error("missing required UI element");
    const cardRect=card.getBoundingClientRect();
    const contentRect=content.getBoundingClientRect();
    const mediaRect=media.getBoundingClientRect();
    const contextRect=context.getBoundingClientRect();
    const typeRect=type.getBoundingClientRect();
    const viewport=win.innerWidth;
    const mobile=viewport<700;
    const links=[...doc.querySelectorAll('link[rel="stylesheet"]')].map(x=>x.getAttribute("href")||"");
    const checks={
      v3:links.some(x=>x.includes("rook-ui-v3.css")),
      cardWide:cardRect.width>viewport*.85,
      cardHeight:mobile?cardRect.height>=120&&cardRect.height<168:cardRect.height>=105,
      realLayout:Math.abs(mediaRect.left-cardRect.left)<6&&contentRect.top>=cardRect.top&&contentRect.bottom<=cardRect.bottom+1&&contextRect.right<=cardRect.right,
      contentPosition:mobile?contentRect.top<cardRect.top+18:contentRect.left>cardRect.left+cardRect.width*.25,
      contextPosition:mobile?contextRect.top<=contentRect.top+1:contextRect.left>cardRect.left+cardRect.width*.55,
      continuousSurface:getComputedStyle(content).backgroundColor==='rgba(0, 0, 0, 0)',
      scoreProminent:doc.querySelector('.fit-ring').getBoundingClientRect().width>=30,
      scoreBelowStar:doc.querySelector('.fit-ring').getBoundingClientRect().top>=doc.querySelector('.save-button').getBoundingClientRect().bottom,
      ignoredControls:Boolean(doc.querySelector('#open-ignored')&&doc.querySelector('#undo-ignore')),
      typeIconOnly:!doc.querySelector('.property-type-icon small'),
      saveAtRight:doc.querySelector('.save-button').getBoundingClientRect().left>cardRect.left+cardRect.width*.8,
      fallbackHasTypeIcon:[...doc.querySelectorAll('.property-visual--fallback')].every(el=>Boolean(el.querySelector('.property-placeholder-icon svg'))),
      actionsClear:[...doc.querySelectorAll('.property-card')].every(el=>el.querySelector('.compact-actions').getBoundingClientRect().bottom<=el.getBoundingClientRect().bottom+1),
      typeVisible:typeRect.width>20&&typeRect.height>=14,
      overviewVisible:getComputedStyle(overview).display!=="none"&&overview.getBoundingClientRect().height>200,
      mapProvider:map.dataset.mapProvider==="maplibre-openfreemap",
      mapHostIsDiv:map.tagName==="DIV",
      baseMapLoaded:Number(map.dataset.baseLayerCount||0)>5&&Number(map.dataset.baseSourceCount||0)>0,
      cardMapLabelFree:!doc.querySelector(".card-map-frame")&&!doc.querySelector(".map-marker small"),
      noPrimaryContact:[...doc.querySelectorAll(".compact-actions")].every(el=>!/\bContact\b/i.test(el.textContent||"")),
      noCardMapRuntime:!doc.querySelector(".property-card .maplibregl-map,.property-card canvas"),
      strictSourceLinks:[...doc.querySelectorAll(".source-link")].every(link=>{try{const u=new URL(link.href);return !/google\.com$/i.test(u.hostname)&&!u.pathname.includes("/search");}catch{return false}}),
      listingActionsUsable:[...doc.querySelectorAll(".listing-action")].every(el=>el.tagName==="A"&&!el.hasAttribute("disabled")),
      listingActionsCompact:[...doc.querySelectorAll(".listing-action")].every(el=>el.getBoundingClientRect().width<cardRect.width*.38),
      recoverySearchesSeparated:[...doc.querySelectorAll(".listing-recovery-link")].every(link=>!link.classList.contains("source-link")),
      noHorizontalOverflow:doc.documentElement.scrollWidth<=viewport+2
    };
    const pass=Object.values(checks).every(Boolean);
    result.textContent=JSON.stringify({pass,viewport,checks,card:{w:Math.round(cardRect.width),h:Math.round(cardRect.height)},map:{status:map.dataset.mapStatus||"",baseLayers:Number(map.dataset.baseLayerCount||0),baseSources:Number(map.dataset.baseSourceCount||0),lastError:map.dataset.mapLastError||""}});
    document.body.dataset.qa=pass?"pass":"fail";
  }catch(error){
    result.textContent=JSON.stringify({pass:false,error:String(error&&error.message||error)});
    document.body.dataset.qa="fail";
  }
}
frame.addEventListener("load",()=>setTimeout(finish,1200),{once:true});
setTimeout(()=>{if(!document.body.dataset.qa)finish()},5000);
</script>
